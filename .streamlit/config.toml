[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f6f4"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
borderColor = "#e1e0d9"
codeBackgroundColor = "#f6f6f4"

redColor = "#d03b3b"
orangeColor = "#eb6834"
yellowColor = "#eda100"
greenColor = "#0ca30c"
blueColor = "#2a78d6"
violetColor = "#4a3aa7"
grayColor = "#898781"

chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["30px", "24px", "20px", "17px", "15px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
linkUnderline = false

baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#f0efec"
borderColor = "#e1e0d9"
primaryColor = "#2a78d6"
